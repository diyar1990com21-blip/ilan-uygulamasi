<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlanlar Paneli - Parça ve Eşya</title>
    <script src="https://tailwindcss.com"></script>
    <!-- Harita için Leaflet CSS ve JS entegrasyonu -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        #map { height: 250px; border-radius: 12px; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <!-- ÜST BAŞLIK PANELI -->
    <div class="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div>
            <h1 class="text-xl font-bold text-emerald-400">İlan Paneli</h1>
            <p class="text-xs text-slate-400">Türkiye Geneli Alıcı Talepleri</p>
        </div>
        <button onclick="location.href='/'" class="text-xs bg-slate-700 px-3 py-2 rounded-lg hover:bg-slate-600">Çıkış</button>
    </div>

    <!-- HARİTA GÖRÜNÜMÜ -->
    <div class="mb-6">
        <h3 class="text-sm font-semibold mb-2 text-slate-300">📍 Yakınındaki Talepler (Harita)</h3>
        <div id="map" class="border border-slate-700 shadow-lg"></div>
    </div>

    <!-- ALICI İÇİN: YENİ İLAN (TALEP) VERME FORMU -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-6 shadow-xl">
        <h2 class="text-lg font-bold text-emerald-400 mb-4">➕ Ne Arıyorsunuz? (İlan Ver)</h2>
        
        <!-- Kategori Seçimi -->
        <div class="mb-3">
            <label class="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
            <select id="kategori" onchange="kategoriDegisti()" class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none">
                <option value="Araç Parçası">Araç Parçası</option>
                <option value="Aksesuar">Aksesuar / Modifiye</option>
                <option value="İkinci El Eşya">İkinci El Eşya</option>
            </select>
        </div>

        <!-- Araç Detayları (Sadece Parça ve Aksesuar seçiliymiş gibi dinamik kalacak) -->
        <div id="arac-formu" class="space-y-3">
            <div class="flex gap-2">
                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Marka</label>
                    <input type="text" id="marka" placeholder="Örn: Renault" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Model</label>
                    <input type="text" id="model" placeholder="Örn: Megane" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Model Yılı</label>
                <input type="number" id="yil" placeholder="Örn: 2015" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
            </div>
        </div>

        <!-- Konum Bilgisi (İl, İlçe, Merkez) -->
        <div class="grid grid-cols-2 gap-2 mt-3">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">İl</label>
                <input type="text" id="il" placeholder="Örn: İstanbul" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">İlçe / Merkez</label>
                <input type="text" id="ilce" placeholder="Örn: Kadıköy" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
            </div>
        </div>

        <!-- Bütçe ve Serbest Metin Detayı -->
        <div class="mt-3">
            <label class="block text-xs font-medium text-slate-400 mb-1">Hedef Bütçeniz (TL)</label>
            <input type="text" id="butce" placeholder="Örn: 3.000 TL veya Fiyat Alacağım" class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm">
        </div>
        <div class="mt-3">
            <label class="block text-xs font-medium text-slate-400 mb-1">Aradığınız Ürünün/Parçanın Detayı</label>
            <textarea id="detay" placeholder="Parça kodu, durumu, rengi veya eşyanın temizlik durumu hakkında detay yazın..." class="w-full p-2 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm h-20"></textarea>
        </div>

        <button onclick="ilanVer()" class="w-full bg-emerald-500 text-slate-900 font-bold p-3 rounded-lg mt-4 hover:bg-emerald-600 transition">Talebi Yayınla</button>
    </div>

    <!-- ESNAF VE GENEL KULLANICI İÇİN: GELEN TALEPLER LİSTESİ -->
    <div>
        <h3 class="text-sm font-semibold mb-3 text-slate-300">📋 Güncel Aranan Ürünler / Parçalar</h3>
        <div id="ilan-listesi" class="space-y-3">
            <!-- Örnek İlan Kartı -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <div class="flex justify-between items-start mb-2">
                    <span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/30">ARAÇ PARÇASI</span>
                    <span class="text-xs text-slate-400">📍 İstanbul, Kadıköy</span>
                </div>
                <h4 class="font-bold text-white text-sm">Renault Megane (2015)</h4>
                <p class="text-xs text-slate-300 mt-1">Sağ ön kapı çıkma orijinal boyasız beyaz renk arıyorum.</p>
                <div class="mt-3 pt-3 border-t border-slate-700 flex justify-between items-center">
                    <span class="text-xs font-semibold text-emerald-400">Bütçe: 4.500 TL</span>
                    <!-- Seçenek C: Resmi Teklif Verme Kutusu Tetikleyici -->
                    <button class="bg-emerald-500 text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-emerald-600">Teklif Sun (Esnaf)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Haritayı Türkiye merkezli olarak ilklendirme (Örn: Ankara koordinatları)
        var map = L.map('map').setView([39.9334, 32.8597], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Örnek bir ilan pini ekleme
        L.marker([41.0082, 28.9784]).addTo(map)
            .bindPopup('<b>İstanbul Kadıköy</b><br>Renault Parçası Aranıyor.');

        function kategoriDegisti() {
            const kat = document.getElementById('kategori').value;
            const aracFormu = document.getElementById('arac-formu');
            if(kat === 'İkinci El Eşya') {
                aracFormu.classList.add('hidden');
            } else {
                aracFormu.classList.remove('hidden');
            }
        }

        function ilanVer() {
            alert('İlan verme motoru aktif! Render sunucunuza veri tabanı kaydı gönderiliyor.');
        }
    </script>
</body>
</html>
